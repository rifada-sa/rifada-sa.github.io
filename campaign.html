<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>لوحة الحملة | رِفادة</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>رِفادة</h1>
        <nav>
            <a href="index.html">الرئيسية</a>
        </nav>
        <button id="theme-btn">🌙 ليل مزدلفة</button>
    </header>
    <main>
        <section id="auth-box">
            <div class="tabs" role="tablist">
                <button type="button" class="tab" id="tab-signup" role="tab" aria-selected="true">حساب جديد</button>
                <button type="button" class="tab" id="tab-login" role="tab" aria-selected="false">تسجيل دخول</button>
            </div>

            <!-- حساب جديد -->
            <form id="signup-form" class="auth-form">
                <label for="signup-name">اسم الحملة</label>
                <input type="text" id="signup-name" placeholder="مثلاً: حملة النور" required>

                <label for="signup-email">الإيميل</label>
                <input type="email" id="signup-email" autocomplete="email" required>

                <label for="signup-password">كلمة السر (٨ حروف أو أكثر)</label>
                <input type="password" id="signup-password" autocomplete="new-password" minlength="8" required>

                <button type="submit">أنشئ حساب الحملة</button>
                <p id="signup-msg" class="form-msg" role="alert"></p>
            </form>

            <!-- تسجيل دخول -->
            <form id="login-form" class="auth-form" hidden>
                <label for="login-email">الإيميل</label>
                <input type="email" id="login-email" autocomplete="email" required>

                <label for="login-password">كلمة السر</label>
                <input type="password" id="login-password" autocomplete="current-password" required>

                <button type="submit">دخول</button>
                <button type="button" id="forgot-btn" class="link-btn">نسيت كلمة السر؟</button>
                <p id="login-msg" class="form-msg" role="alert"></p>
            </form>
        </section>

        <div id="dashboard" hidden>
            <div id="code-bar">
                <p>رمز حملتك: <span id="campaign-code" dir="ltr">……</span></p>
                <button type="button" id="logout-btn">خروج</button>
            </div>

            <section class="campaign-hero">
                <h1>اكتب يوم حجّاجك</h1>
                <p>مرة وحدة. وكل تعديل يوصلهم في لحظته.</p>
            </section>

            <form id="campaign-form">
                <label for="campaign-name">اسم الحملة</label>
                <input type="text" id="campaign-name" placeholder="مثلاً: حملة النور" required>

                <label for="start-date">تاريخ يوم التروية (٨ ذو الحجة)</label>
                <input type="date" id="start-date">

                <h2>مسبحة اليوم</h2>
                <!-- أزرار الأيام: الجافاسكربت يعبّيها من DAYS -->
                <div class="day-tabs" id="day-tabs" role="tablist" aria-label="أيام الحج"></div>
                <p id="day-line"></p>

                <ol id="events"></ol>
                <button type="button" id="add-event">+ أضف حبّة للمسبحة</button>

                <button type="submit">انشر الأيام لحجّاجك</button>
                <p id="publish-msg" role="status"></p>
            </form>
        </div>

        <!-- قالب الحبّة: الجافاسكربت ينسخه كل ما نضغط "أضف" -->
        <template id="event-template">
            <li class="event">
                <input type="time" aria-label="الوقت">
                <input type="text" aria-label="الفعالية" placeholder="مثلاً: الانطلاق إلى منى">
                <button type="button" class="remove" aria-label="حذف الفعالية">✕</button>
            </li>
        </template>
    </main>
    <footer>
        <p>صُنع بحب لضيوف الرحمن 🤍</p>
    </footer>
    <script src="script.js"></script>
    <script type="module" src="campaign.js"></script>
</body>

</html>
